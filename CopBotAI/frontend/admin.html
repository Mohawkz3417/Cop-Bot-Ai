<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CopBot AI — Analytics Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  body{ overflow-y:auto; height:auto; min-height:100vh; }
  .admin-wrap{ max-width:1080px; margin:0 auto; padding:28px 22px 60px; }
  .admin-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:10px; }
  .admin-header h1{ font-size:22px; margin:0; font-weight:800; letter-spacing:-.4px; }
  .admin-header p{ color:var(--text-muted); margin:4px 0 0; font-size:13px; }
  .back-link{ color:var(--accent); text-decoration:none; font-size:13px; font-weight:600; }
  .kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:26px; }
  .kpi-card{
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:16px 18px; box-shadow:var(--shadow-sm);
  }
  .kpi-card .kpi-label{ font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
  .kpi-card .kpi-value{ font-size:28px; font-weight:800; margin-top:6px; letter-spacing:-.5px; }
  .kpi-card .kpi-sub{ font-size:11.5px; color:var(--text-faint); margin-top:2px; }
  .charts-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
  .chart-card{
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:18px; box-shadow:var(--shadow-sm);
  }
  .chart-card h3{ margin:0 0 12px; font-size:14px; font-weight:700; }
  .chart-card canvas{ max-height:220px; }
  .empty-note{ color:var(--text-faint); font-size:12.5px; text-align:center; padding:30px 0; }
  @media (max-width:760px){ .charts-grid{ grid-template-columns:1fr; } }
</style>
</head>
<body data-theme="dark">
<div class="admin-wrap">
  <div class="admin-header">
    <div>
      <h1>📊 CopBot AI — Analytics Dashboard</h1>
      <p>Live usage stats pulled from <code>/api/stats</code>. Refreshes every 15s.</p>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <a class="back-link" href="index.html">← Back to chat</a>
      <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
    </div>
  </div>

  <div class="kpi-grid" id="kpiGrid"><!-- injected --></div>

  <div class="charts-grid">
    <div class="chart-card">
      <h3>Messages per day (last 14 days)</h3>
      <canvas id="chartDaily"></canvas>
    </div>
    <div class="chart-card">
      <h3>Answers by AI provider</h3>
      <canvas id="chartProvider"></canvas>
    </div>
    <div class="chart-card">
      <h3>Complaints filed by crime type</h3>
      <canvas id="chartComplaints"></canvas>
    </div>
    <div class="chart-card">
      <h3>Answer feedback</h3>
      <canvas id="chartFeedback"></canvas>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const el = (s) => document.querySelector(s);
const theme = localStorage.getItem("copbot_theme") || "dark";
document.body.setAttribute("data-theme", theme);
el("#themeToggle").textContent = theme === "dark" ? "🌙" : "☀️";
el("#themeToggle").addEventListener("click", () => {
  const cur = document.body.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.body.setAttribute("data-theme", next);
  localStorage.setItem("copbot_theme", next);
  el("#themeToggle").textContent = next === "dark" ? "🌙" : "☀️";
});

const styles = getComputedStyle(document.body);
const gridColor = styles.getPropertyValue("--border").trim();
const textColor = styles.getPropertyValue("--text-muted").trim();
Chart.defaults.color = textColor;
Chart.defaults.borderColor = gridColor;
Chart.defaults.font.family = "Inter, sans-serif";

const PALETTE = ["#2563eb", "#7c3aed", "#16a34a", "#d97706", "#dc2626", "#0891b2"];

let charts = {};

function kpiCard(label, value, sub = "") {
  return `<div class="kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${sub ? `<div class="kpi-sub">${sub}</div>` : ""}</div>`;
}

function destroyIfExists(key) {
  if (charts[key]) { charts[key].destroy(); delete charts[key]; }
}

async function loadStats() {
  try {
    const res = await fetch("/api/stats");
    const data = await res.json();

    el("#kpiGrid").innerHTML = [
      kpiCard("Total Conversations", data.total_sessions),
      kpiCard("Total Messages", data.total_messages),
      kpiCard("Complaints Filed", data.total_filed_complaints),
      kpiCard("Feedback Given", data.feedback.total, `👍 ${data.feedback.up}  ·  👎 ${data.feedback.down}`),
    ].join("");

    destroyIfExists("daily");
    charts.daily = new Chart(el("#chartDaily"), {
      type: "line",
      data: {
        labels: data.messages_by_day.map(d => d.day),
        datasets: [{
          label: "User messages",
          data: data.messages_by_day.map(d => d.c),
          borderColor: PALETTE[0],
          backgroundColor: PALETTE[0] + "22",
          tension: 0.35,
          fill: true,
          pointRadius: 3,
        }],
      },
      options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } },
    });

    destroyIfExists("provider");
    charts.provider = new Chart(el("#chartProvider"), {
      type: "doughnut",
      data: {
        labels: data.provider_split.map(d => d.provider),
        datasets: [{ data: data.provider_split.map(d => d.c), backgroundColor: PALETTE }],
      },
      options: { plugins: { legend: { position: "bottom" } } },
    });

    destroyIfExists("complaints");
    if (data.complaints_by_type.length) {
      charts.complaints = new Chart(el("#chartComplaints"), {
        type: "bar",
        data: {
          labels: data.complaints_by_type.map(d => d.crime_type),
          datasets: [{ label: "Filed", data: data.complaints_by_type.map(d => d.c), backgroundColor: PALETTE[1] }],
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } },
      });
    } else {
      el("#chartComplaints").parentElement.innerHTML = `<h3>Complaints filed by crime type</h3><div class="empty-note">No complaints filed yet — try "File a Complaint" in the chat sidebar.</div>`;
    }

    destroyIfExists("feedback");
    charts.feedback = new Chart(el("#chartFeedback"), {
      type: "doughnut",
      data: {
        labels: ["👍 Helpful", "👎 Not helpful"],
        datasets: [{ data: [data.feedback.up, data.feedback.down], backgroundColor: [PALETTE[2], PALETTE[4]] }],
      },
      options: { plugins: { legend: { position: "bottom" } } },
    });
  } catch (e) {
    el("#kpiGrid").innerHTML = `<div class="empty-note">Could not load stats — is the backend running?</div>`;
  }
}

loadStats();
setInterval(loadStats, 15000);
</script>
</body>
</html>
